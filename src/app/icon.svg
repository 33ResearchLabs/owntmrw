<!--
  Favicon: the Underly mark — a solid disc over a rounded bar, on the brand's
  cream ground.

  Drawn rather than exported so it stays crisp at 16px, where a rasterised
  mark of two shapes this simple only loses edges. It sits beside the
  `favicon.ico` Next.js already serves; `icon.svg` takes precedence in every
  browser that supports it and the .ico remains the fallback.

  The ground is painted rather than left transparent: a browser tab is not
  reliably light or dark, and the navy disc disappears against a dark one.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Underly">
  <rect width="64" height="64" rx="12" fill="#F3EFE9" />
  <circle cx="32" cy="24" r="12" fill="#0B1320" />
  <rect x="13" y="42" width="38" height="8" rx="4" fill="#A98A55" />
</svg>
