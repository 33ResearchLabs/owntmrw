services:
  - type: web
    name: owntmrw
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # better-sqlite3@13 requires Node >=22 (it targets Node-API v10, which
      # Node 20 doesn't implement — loading it there segfaults at runtime).
      - key: NODE_VERSION
        value: 22
      - key: SOLANA_RPC_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      # Pipeline-health panel — development only. Stated explicitly rather than
      # left to the NODE_ENV default so turning it on to debug a deploy is a
      # dashboard edit, not a code change.
      - key: SHOW_DATA_COVERAGE
        value: "false"
