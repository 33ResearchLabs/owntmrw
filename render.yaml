services:
  - type: web
    name: owntmrw
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      # better-sqlite3@13 requires Node >=22 (it targets Node-API v10, which
      # Node 20 doesn't implement — loading it there segfaults at runtime).
      - key: NODE_VERSION
        value: 22
      - key: SOLANA_RPC_URL
        sync: false
      - key: GITHUB_TOKEN
        sync: false
